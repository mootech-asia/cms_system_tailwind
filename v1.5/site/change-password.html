<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>
      <main class="usercenter-main">
        <div data-mount="user-navbar"></div>
        <div class="usercenter-grid">
          <div data-mount="user-sidebar"></div>
          <div class="usercenter-content">
            <div class="pay-page">
              <h1 class="pay-page-title" data-cp-title>로그인 비밀번호 변경</h1>
              <section class="pay-section">
                <div class="pay-section-inner">
                  <div class="cp-field" data-cp-current-wrap style="display: none">
                    <input type="password" placeholder="현재 비밀번호를 입력해 주세요" data-i18n-placeholder="userCenter.changePassword.currentPlaceholder" data-cp-current />
                    <button type="button" class="cp-toggle" data-cp-toggle="current"><img src="assets/images/icon/eye.svg" alt="toggle" /></button>
                  </div>
                  <div class="cp-field">
                    <input type="password" placeholder="새 비밀번호를 입력해 주세요" data-i18n-placeholder="userCenter.changePassword.newPlaceholder" data-cp-new />
                    <button type="button" class="cp-toggle" data-cp-toggle="new"><img src="assets/images/icon/eye.svg" alt="toggle" /></button>
                  </div>
                  <div class="cp-field">
                    <input type="password" placeholder="새 비밀번호 확인" data-i18n-placeholder="userCenter.changePassword.confirmPlaceholder" data-cp-confirm />
                    <button type="button" class="cp-toggle" data-cp-toggle="confirm"><img src="assets/images/icon/eye.svg" alt="toggle" /></button>
                  </div>

                  <div class="cp-hint">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.39 4.84L20 8l-4 3.9L17 18l-5-2.62L7 18l1-6.1L4 8l5.61-1.16z"></path></svg>
                    <span data-i18n="userCenter.changePassword.ruleHint">6~16자의 영문과 숫자만 사용할 수 있습니다.</span>
                  </div>

                  <button type="button" class="pay-next-btn" data-cp-submit disabled style="margin-top: 32px">
                    <span class="text-gradient" data-i18n="userCenter.personalInfoPage.submit">제출</span>
                  </button>
                  <button type="button" class="pay-back-btn" data-nav-href="security.html" data-i18n="common.back">뒤로</button>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var W = window.WIN15;
        var type = new URLSearchParams(location.search).get('type') || 'lgps';
        var isLogin = type === 'lgps';
        document.querySelector('[data-cp-title]').textContent = isLogin ? W.t('userCenter.changePassword.changeLogin') : W.t('userCenter.changePassword.changeTransaction');
        if (isLogin) W.qs('[data-cp-current-wrap]').style.display = 'block';

        var cur = W.qs('[data-cp-current]');
        var np = W.qs('[data-cp-new]');
        var cf = W.qs('[data-cp-confirm]');
        var submitBtn = W.qs('[data-cp-submit]');

        function refresh() {
          var needCurrent = isLogin;
          submitBtn.disabled = !((!needCurrent || cur.value) && np.value && cf.value);
        }
        [cur, np, cf].forEach(function (el) { W.on(el, 'input', refresh); });
        refresh();

        W.qsa('[data-cp-toggle]').forEach(function (btn) {
          W.on(btn, 'click', function () {
            var target = btn.getAttribute('data-cp-toggle') === 'current' ? cur : btn.getAttribute('data-cp-toggle') === 'new' ? np : cf;
            var img = btn.querySelector('img');
            var show = target.type === 'password';
            target.type = show ? 'text' : 'password';
            img.src = show ? W.icon('eye-show.svg') : W.icon('eye.svg');
          });
        });

        W.on(submitBtn, 'click', function () {
          if (submitBtn.disabled) return;
          if (np.value !== cf.value) {
            W.showAlert({ type: 'error', message: W.t('userCenter.changePassword.confirmInvalid') });
            return;
          }
          W.showAlert({ type: 'success', message: W.t('userCenter.changePassword.success'), redirectUrl: 'account.html' });
        });
      };
    </script>
  </body>
</html>
