<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>
      <main class="usercenter-main">
        <div data-mount="user-navbar"></div>
        <div class="usercenter-grid">
          <div data-mount="user-sidebar"></div>
          <div class="usercenter-content">
            <div class="record-page">
              <h1 class="account-page-title" data-i18n="userCenter.sidebar.withdrawalRecord">출금 기록</h1>
              <div class="record-inner">
                <div class="record-tags">
                  <div class="record-status-wrap">
                    <button type="button" class="record-status-btn" data-toggle-status>
                      <span data-i18n="userCenter.common.tags.status">상태</span><span data-status-text></span>
                    </button>
                    <div class="record-status-panel" data-status-panel>
                      <button type="button" class="is-active" data-status-value="" data-i18n="userCenter.common.selectList.all">전체</button>
                      <button type="button" data-status-value="Pending" data-i18n="userCenter.common.selectList.pending">대기</button>
                      <button type="button" data-status-value="Approved" data-i18n="userCenter.common.selectList.approved">승인</button>
                      <button type="button" data-status-value="Rejected" data-i18n="userCenter.common.selectList.rejected">거부</button>
                    </div>
                  </div>
                  <button type="button" class="record-date-btn">2026-08-01 ~ 2026-08-12</button>
                  <button type="button" class="record-confirm-btn" data-i18n="common.confirm">확인</button>
                  <div class="record-refresh"><span data-i18n="userCenter.common.autoRefresh.in">자동 갱신까지</span><strong>30</strong><span data-i18n="userCenter.common.autoRefresh.secondsShort">초</span><img src="assets/images/icon/refresh-blue.svg" alt="refresh" data-refresh-btn /></div>
                </div>

                <div class="record-table-wrap">
                  <table class="record-table record-mobile-only record-mobile-table">
                    <thead>
                      <tr>
                        <th data-i18n="userCenter.common.headers.transactionNo">거래 번호</th>
                        <th data-i18n="userCenter.common.headers.requestTime">요청 시간</th>
                        <th data-i18n="userCenter.common.headers.paidAmountHeader">지급 금액</th>
                        <th data-i18n="userCenter.common.headers.status">상태</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-mobile></tbody>
                  </table>

                  <table class="record-table record-desktop-only">
                    <thead>
                      <tr>
                        <th data-i18n="userCenter.common.headers.transactionNo">거래 번호</th>
                        <th data-i18n="userCenter.common.headers.requestTime">요청 시간</th>
                        <th data-i18n="userCenter.common.headers.paidAmountHeader">지급 금액</th>
                        <th data-i18n="userCenter.common.headers.status">상태</th>
                        <th data-i18n="userCenter.common.headers.requestAmountHeader">요청 금액</th>
                        <th data-i18n="userCenter.common.headers.bankName">은행명</th>
                        <th data-i18n="userCenter.common.headers.paidDate">지급 일자</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-desktop></tbody>
                  </table>
                </div>

                <div class="record-footer-total">
                  <div class="record-footer-total-inner">
                    <span data-i18n="userCenter.common.footer.totalWithdrawalAmount">총 출금 금액</span>
                    <span data-total-amount>0</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        function statusClass(s) { return s === 'Approved' ? 'status-text-approved' : s === 'Rejected' ? 'status-text-reject' : 'status-text-pending'; }
        function statusText(s) { return W.t('userCenter.common.selectList.' + s.toLowerCase()); }
        var currentStatus = '';

        function render() {
          var rows = D.WITHDRAWAL_RECORDS.filter(function (r) { return !currentStatus || r.status === currentStatus; });
          W.qs('[data-record-body-mobile]').innerHTML = rows.map(function (r) {
            return '<tr><td>' + r.transaction_number + '</td><td>' + r.request_time + '</td><td>' + (r.paid_amount ? fmt(r.paid_amount) : '-') + '</td><td class="' + statusClass(r.status) + '">' + statusText(r.status) + '</td></tr>';
          }).join('');
          W.qs('[data-record-body-desktop]').innerHTML = rows.map(function (r) {
            return '<tr><td>' + r.transaction_number + '</td><td>' + r.request_time + '</td><td>' + (r.paid_amount ? fmt(r.paid_amount) : '-') + '</td><td class="' + statusClass(r.status) + '">' + statusText(r.status) + '</td><td>' + fmt(r.request_amount) + '</td><td>' + r.bank_name + '</td><td>' + r.paid_date + '</td></tr>';
          }).join('');
          var total = rows.reduce(function (s, r) { return r.status === 'Approved' ? s + r.paid_amount : s; }, 0);
          W.qs('[data-total-amount]').textContent = fmt(total);
        }

        var panel = W.qs('[data-status-panel]');
        W.on(W.qs('[data-toggle-status]'), 'click', function () { panel.classList.toggle('is-open'); });
        /* 對照設計稿:「상태」按鈕永遠要顯示目前選取的選項(含「전체」),
           不是只有選了 Pending/Approved/Rejected 才補上文字 */
        W.qs('[data-status-text]').textContent = '： ' + W.qs('[data-status-value].is-active').textContent;
        W.qsa('[data-status-value]').forEach(function (btn) {
          W.on(btn, 'click', function () {
            currentStatus = btn.getAttribute('data-status-value');
            W.qsa('[data-status-value]').forEach(function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            W.qs('[data-status-text]').textContent = '： ' + btn.textContent;
            panel.classList.remove('is-open');
            render();
          });
        });
        W.initAutoRefresh(render);
        W.initDateRangePicker(W.qs('.record-date-btn'));
        W.on(document, 'win15:localechange', render);

        render();
      };
    </script>
  </body>
</html>
