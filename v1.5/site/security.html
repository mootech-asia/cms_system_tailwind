<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>
      <main class="usercenter-main">
        <div data-mount="user-navbar"></div>
        <div class="usercenter-grid">
          <div data-mount="user-sidebar"></div>
          <div class="usercenter-content">
            <div class="sec-page">
              <h1 class="pay-page-title" data-i18n="userCenter.sidebar.securityCenter">보안 센터</h1>
              <div class="sec-inner">
                <div>
                  <h2 class="sec-block-title" data-i18n="userCenter.securityCenterPage.lastLogin">마지막 로그인</h2>
                  <div class="sec-card">
                    <div class="sec-row"><span class="label" data-i18n="userCenter.securityCenterPage.time">시간</span><span class="value">2026-08-11 13:29:25</span></div>
                    <div class="sec-row"><span class="label" data-i18n="userCenter.securityCenterPage.ipAddress">IP 주소</span><span class="value">125.227.44.193</span></div>
                  </div>
                </div>

                <div style="margin-top: 16px">
                  <h2 class="sec-block-title" data-i18n="userCenter.securityCenterPage.securitySetting">보안 설정</h2>
                  <div class="sec-list">
                    <button type="button" data-nav-href="personal-info.html">
                      <img src="assets/images/icon/usercenter/personal.svg" alt="user" />
                      <div><p class="stitle" data-i18n="userCenter.sidebar.personalInfo">개인 정보</p><p class="sdesc" data-i18n="userCenter.securityCenterPage.completeProfile">개인 정보를 완료하세요</p></div>
                    </button>
                    <button type="button" data-nav-href="change-password.html?type=lgps">
                      <img src="assets/images/icon/usercenter/lock.svg" alt="lock" />
                      <div><p class="stitle" data-i18n="userCenter.changePassword.changeLogin">로그인 비밀번호 변경</p><p class="sdesc" data-i18n="userCenter.securityCenterPage.recommendAlphaNum">영문과 숫자 조합을 권장합니다</p></div>
                    </button>
                    <button type="button" data-nav-href="change-password.html?type=tsps">
                      <img src="assets/images/icon/usercenter/password.svg" alt="pin" />
                      <div><p class="stitle" data-i18n="userCenter.changePassword.changeTransaction">거래 비밀번호 변경</p><p class="sdesc" data-i18n="userCenter.securityCenterPage.setTxnPasswordTip">자금 보안을 위해 거래 비밀번호를 설정하세요</p></div>
                      <span class="sec-status status-text-approved" data-i18n="userCenter.securityCenterPage.set">설정</span>
                    </button>
                    <button type="button" data-nav-href="banking-details.html">
                      <img src="assets/images/icon/usercenter/creditCard.svg" alt="bank" />
                      <div><p class="stitle" data-i18n="userCenter.securityCenterPage.bankAccountNumber">은행 계좌 번호</p><p class="sdesc" data-i18n="userCenter.securityCenterPage.recommendAlphaNum">영문과 숫자 조합을 권장합니다</p></div>
                      <span class="sec-status status-text-approved" data-i18n="userCenter.securityCenterPage.set">설정</span>
                    </button>
                    <button type="button" data-logout>
                      <img src="assets/images/icon/usercenter/logout.svg" alt="logout" />
                      <div><p class="stitle" data-i18n="userCenter.securityCenterPage.logout">로그아웃</p><p class="sdesc" data-i18n="userCenter.securityCenterPage.logoutSafely">안전하게 로그아웃</p></div>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>window.WIN15_PAGE_INIT = function () {};</script>
  </body>
</html>
